name: CI — Build, Scan & Push

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'helm/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: nexaretail-api
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  code-quality:
    name: 🔍 Code Quality & npm Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: npm audit (sécurité dépendances)
        working-directory: app
        run: npm audit --audit-level=high

  build-scan-push:
    name: 🐳 Build → Trivy Scan → Push ACR
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login ACR Azure
        run: az acr login --name nexaretailprodacr

      - name: Build image Docker
        run: |
          docker build \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg APP_VERSION=1.0.${{ github.run_number }} \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:1.0.${{ github.run_number }} \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:latest \
            app/

      - name: Scan Trivy — CRITICAL et HIGH bloquants
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          skip-dirs: '/usr/local/lib/node_modules/npm,/usr/local/lib/node_modules/corepack,/opt/yarn-v1.22.22'

      - name: Rapport Trivy complet (informatif)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: 'MEDIUM,LOW'
          skip-dirs: '/usr/local/lib/node_modules/npm,/usr/local/lib/node_modules/corepack,/opt/yarn-v1.22.22'
        continue-on-error: true

      - name: Upload rapport Trivy
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-report
          path: trivy-results.sarif

      - name: Push vers ACR Azure
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:1.0.${{ github.run_number }}
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:latest
          echo "✅ Image pushée : $ACR_LOGIN_SERVER/$IMAGE_NAME:1.0.${{ github.run_number }}"

  # ─────────────────────────────────────────────
  # JOB 3 : Mise à jour automatique du Helm Chart
  # ─────────────────────────────────────────────
  update-helm:
    name: 🔄 Update Helm values → GitOps
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout avec token CD
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Mettre à jour le tag image dans values.yaml
        run: |
          NEW_TAG="1.0.${{ github.run_number }}"
          echo "🏷️ Nouveau tag : $NEW_TAG"
          sed -i "s|tag: \".*\"|tag: \"${NEW_TAG}\"|g" helm/nexaretail-api/values.yaml
          echo "✅ values.yaml mis à jour :"
          grep "tag:" helm/nexaretail-api/values.yaml

      - name: Configurer Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit et push du nouveau tag
        run: |
          git add helm/nexaretail-api/values.yaml
          git diff --staged --quiet || git commit -m "chore(cd): bump nexaretail-api image tag to 1.0.${{ github.run_number }}

          - Image: nexaretailprodacr.azurecr.io/nexaretail-api:1.0.${{ github.run_number }}
          - Pipeline run: ${{ github.run_number }}
          - Commit source: ${{ github.sha }}
          [skip ci]"
          git push origin main
          echo "✅ values.yaml pushé — ArgoCD va détecter le changement"
